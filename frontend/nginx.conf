server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_backend api:8000;
        proxy_pass http://$api_backend$request_uri;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
