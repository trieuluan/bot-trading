<!doctype html>
<html lang="vi">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forex lifecycle layout check</title>
<div id="root"></div>
<script type="module">
  import React, { useState } from 'react';
  import { createRoot } from 'react-dom/client';
  import { ForexSignalLifecycle } from '/src/components/ForexSignalLifecycle.tsx';
  import { ForexStripLegend } from '/src/components/ForexMarkets.tsx';
  import '/src/styles.css';

  const setups = Array.from({ length: 12 }, (_, index) => {
    const time = 1793030400 - index * 900;
    const status = ['waiting', 'submitting', 'uncertain', 'submitted', 'cancelled', 'expired'][index % 6];
    return {
      id: `fixture-${index}`, time, side: 'short',
      signals: [{ strategy: 'hast4_fixture', side: 'short', available_at: time,
        status: index % 4 === 0 ? 'waiting' : 'recorded' }],
      intents: index % 4 === 0 ? [] : [{
        id: `intent-${index}`, strategy: 'hast4_fixture', side: 'short', status,
        limit_price: 157.45, stop_price: 157.65, available_at: time,
        reason: 'trigger_preflight_failed', winner: 'limit', triggered_at: time + 60,
        ended_at: status === 'cancelled' || status === 'expired' ? time + 120 : null,
        broker_fills: status === 'submitted' ? [{ position_id: '123456789', price: 157.45 }] : [],
      }],
    };
  });

  function Fixture() {
    const [selectedId, select] = useState(null);
    const [result, setResult] = useState('');
    function checkLayout() {
      const list = document.querySelector('.signal-lifecycle-list');
      const rows = Array.from(list.querySelectorAll('.signal-lifecycle-row'));
      const clipped = rows.some(row => {
        const button = row.querySelector('button');
        return row.clientHeight < button.offsetHeight || row.scrollWidth > row.clientWidth;
      });
      const passed = rows.length > 0 && !clipped && list.clientHeight <= 360 &&
        (rows.length < 9 || list.scrollHeight > list.clientHeight) &&
        document.documentElement.scrollWidth <= innerWidth;
      setResult(passed ? `PASS: ${rows.length} rows, no clipped content or horizontal overflow` : 'FAIL: layout regression');
      console.assert(passed, 'Lifecycle rows must retain their content height inside the scrolling list');
    }
    return React.createElement('main', { style: { margin: '24px auto', maxWidth: 1100 } },
      React.createElement('h1', null, 'Local fixture: 12 setups'),
      React.createElement('p', null, 'Synthetic data only. No API requests or broker actions.'),
      React.createElement('section', { className: 'forex-markets is-compact', style: { display: 'flex', justifyContent: 'flex-end' } }, React.createElement(ForexStripLegend)),
      React.createElement('button', { type: 'button', onClick: checkLayout }, 'Check layout'),
      React.createElement('output', { role: 'status' }, result),
      React.createElement(ForexSignalLifecycle, {
        setups, symbol: 'USDJPY', selectedId, onSelect: select,
      }));
  }
  createRoot(document.getElementById('root')).render(React.createElement(Fixture));
</script>
</html>
