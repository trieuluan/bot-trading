services:
  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: 'true'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 80 --strictPort
volumes:
  frontend_node_modules:
