x-python-dev: &python-dev
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: development
  environment:
    PYTHONDONTWRITEBYTECODE: '1'
    PYTHONUNBUFFERED: '1'
    WATCHFILES_FORCE_POLLING: 'true'
    RUFF_CACHE_DIR: /tmp/ruff-cache
    PYTEST_ADDOPTS: '-o cache_dir=/tmp/pytest-cache'
  volumes:
    - ./backend:/app/backend:ro
    - ./bot:/app/bot:ro
    - ./migrations:/app/migrations:ro
    - ./alembic.ini:/app/alembic.ini:ro
    - ./pyproject.toml:/app/pyproject.toml:ro

services:
  api:
    <<: *python-dev
    command:
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --reload
      - --reload-dir
      - /app/backend/app
  bot:
    <<: *python-dev
    command:
      - watchfiles
      - --filter
      - python
      - 'python -m bot.worker'
      - /app/backend/app
      - /app/bot
  exness-feed:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    volumes:
      - ./backend:/app/backend:ro
      - ./bot:/app/bot:ro
  migrate:
    <<: *python-dev
  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: 'true'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 80 --strictPort
volumes:
  frontend_node_modules:
