name: bot-trading
x-python: &python
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &python-environment
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-trading}
    TRADING_MODE: ${TRADING_MODE:-paper}
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    <<: *python
    command: [alembic, upgrade, head]
    restart: 'no'
  api:
    <<: *python
    environment:
      <<: *python-environment
      EXNESS_API_KEY: ${EXNESS_API_KEY:-}
      EXNESS_PRIVATE_KEY: ${EXNESS_PRIVATE_KEY:-}
      EXNESS_ACCOUNT_ID: ${EXNESS_ACCOUNT_ID:-}
      EXNESS_API_BASE_URL: ${EXNESS_API_BASE_URL:-https://api.exness.com}
      EXNESS_ENVIRONMENT: ${EXNESS_ENVIRONMENT:-demo}
      EXNESS_SYMBOL: ${EXNESS_SYMBOL:-XAUUSD}
      EXNESS_DATA_ENABLED: ${EXNESS_DATA_ENABLED:-false}
      EXNESS_DEMO_EXECUTION_ENABLED: ${EXNESS_DEMO_EXECUTION_ENABLED:-false}
    volumes:
      - ./research-output:/app/research-output
    command: [uvicorn, backend.app.main:app, --host, 0.0.0.0, --port, '8000']
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health")',
        ]
      interval: 10s
      timeout: 3s
      retries: 6
  bot:
    <<: *python
    command: [python, -m, bot.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
  exness-feed:
    <<: *python
    command: [python, -m, bot.exness_worker]
    environment:
      <<: *python-environment
      EXNESS_API_KEY: ${EXNESS_API_KEY:-}
      EXNESS_PRIVATE_KEY: ${EXNESS_PRIVATE_KEY:-}
      EXNESS_ACCOUNT_ID: ${EXNESS_ACCOUNT_ID:-}
      EXNESS_API_BASE_URL: ${EXNESS_API_BASE_URL:-https://api.exness.com}
      EXNESS_ENVIRONMENT: ${EXNESS_ENVIRONMENT:-demo}
      EXNESS_SYMBOL: ${EXNESS_SYMBOL:-XAUUSD}
      EXNESS_DATA_ENABLED: ${EXNESS_DATA_ENABLED:-false}
      EXNESS_DEMO_EXECUTION_ENABLED: ${EXNESS_DEMO_EXECUTION_ENABLED:-false}
      EXNESS_DEMO_ORDERS_ENABLED: ${EXNESS_DEMO_EXECUTION_ENABLED:-false}
    volumes:
      - ./research-output:/app/research-output
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:3000:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
