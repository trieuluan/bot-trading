# Opt-in overlay for the same API and Forex worker services.
x-live: &live
  EXNESS_ENVIRONMENT: real
  EXNESS_API_KEY: ${EXNESS_LIVE_API_KEY:-}
  EXNESS_PRIVATE_KEY: ${EXNESS_LIVE_PRIVATE_KEY:-}
  EXNESS_ACCOUNT_ID: ${EXNESS_LIVE_ACCOUNT_ID:-}
  EXNESS_API_BASE_URL: ${EXNESS_LIVE_API_BASE_URL:-}
  EXNESS_SYMBOL: ${EXNESS_LIVE_SYMBOL:-XAUUSD}
  EXNESS_SYMBOLS: ${EXNESS_LIVE_SYMBOLS:-XAUUSD}
  EXNESS_PREVIOUS_DEMO_ACCOUNT_ID: ${EXNESS_ACCOUNT_ID:-}
  EXNESS_DATA_ENABLED: "true"
  EXNESS_DEMO_EXECUTION_ENABLED: "false"
  EXNESS_DEMO_ORDERS_ENABLED: "false"
  EXNESS_COMMISSION_PER_LOT_USD: ""
  EXNESS_LIVE_ZERO_COMMISSION_ACCOUNT_ID: ${EXNESS_LIVE_ZERO_COMMISSION_ACCOUNT_ID:-}
  EXNESS_LIVE_EXECUTION_ENABLED: ${EXNESS_LIVE_EXECUTION_ENABLED:-false}
  EXNESS_LIVE_OPEN_ORDERS: ${EXNESS_LIVE_OPEN_ORDERS:-false}
  EXNESS_LIVE_RISK_PER_SETUP_PCT: ${EXNESS_LIVE_RISK_PER_SETUP_PCT:-}
  EXNESS_LIVE_MAX_TOTAL_RISK_PCT: ${EXNESS_LIVE_MAX_TOTAL_RISK_PCT:-}
  EXNESS_LIVE_MAX_DAILY_DRAWDOWN_PCT: ${EXNESS_LIVE_MAX_DAILY_DRAWDOWN_PCT:-}
  EXNESS_LIVE_MAX_POSITIONS: ${EXNESS_LIVE_MAX_POSITIONS:-1}
  EXNESS_LIVE_MAX_POSITIONS_PER_SYMBOL: ${EXNESS_LIVE_MAX_POSITIONS_PER_SYMBOL:-1}
  FOREX_HTF_V2_EXECUTION_ENABLED: "true"
  FOREX_ENTRY_PILOT_ENABLED: "true"
services:
  api:
    environment:
      <<: *live
  exness-feed:
    environment:
      <<: *live
